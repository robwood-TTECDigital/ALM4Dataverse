on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write  # Required for Workload Identity Federation
name: IMPORT
jobs:
  job1:
    environment: DEV_${{ github.ref_name }}
    runs-on: windows-2025-vs2026
    name: IMPORT to DEV_${{ github.ref_name }}
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: ttecdigital-msba-emea/Dataverse-ALM/pipelines/github-workflows/IMPORT@main
        with:
          authtype: WorkloadIdentityFederation  # or ClientSecret
          environment: DEV_${{ github.ref_name }}
          varsjson: ${{ toJSON(vars)}}
          secretsjson: ${{ toJSON(secrets )}}