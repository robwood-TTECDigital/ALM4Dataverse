name: DEPLOY
description: DEPLOY
inputs:
  artifactsrunid:
    required: true
    description: Run ID to get artifacts from
  environment:
    required: true
    description: Env name
  varsjson:
    required: true
    description: Vars
  secretsjson:
    required: true
    description: Secrets
  authtype:
    required: false
    default: ClientSecret
    description: "Authentication type: ClientSecret (default) or WorkloadIdentityFederation"
runs:
  using: composite
  steps:
    - name: Set environment specific vars
      shell: pwsh
      run: |
        $varsjson = @"
        ${{ inputs.varsjson }}
        "@

        $vars = $varsjson | convertfrom-json

        @($vars.psobject.properties) | Where-Object { $_.Name } | foreach-object {
          $name = $_.Name 
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }

        @($vars.psobject.properties) | Where-Object { $_.Name -and $_.Name.StartsWith("${{ inputs.environment }}_", "OrdinalIgnoreCase")} | foreach-object {
          $name = $_.Name -replace "${{ inputs.environment }}_", ""
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }

        $secretsjson = @"
        ${{ inputs.secretsjson }}
        "@

        $secrets = $secretsjson | convertfrom-json
        @($secrets.psobject.properties) | Where-Object { $_.Name } | foreach-object {
          $name = $_.Name
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }

        @($secrets.psobject.properties) | Where-Object { $_.Name -and $_.Name.StartsWith("${{ inputs.environment }}_", "OrdinalIgnoreCase")} | foreach-object {
          $name = $_.Name -replace "${{ inputs.environment }}_", ""
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }
    - name: "Download artifact"
      uses: actions/github-script@v6
      with:
        script: |
          let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
             owner: context.repo.owner,
             repo: context.repo.repo,
             run_id: ${{ inputs.artifactsrunid }},
          });
          let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "artifacts"
          })[0];
          let download = await github.rest.actions.downloadArtifact({
             owner: context.repo.owner,
             repo: context.repo.repo,
             artifact_id: matchArtifact.id,
             archive_format: 'zip',
          });
          let fs = require('fs');
          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/artifacts.zip`, Buffer.from(download.data));
    - name: "Unzip artifact"
      shell: cmd
      run: unzip artifacts.zip -d artifacts

    - uses: microsoft/powerplatform-actions/actions-install@v1
      name: Power Platform Tool Installer
      with:
        add-tools-to-path: true
    - name: Azure Login (Workload Identity Federation)
      if: inputs.authtype == 'WorkloadIdentityFederation'
      uses: azure/login@v2
      with:
        client-id: ${{ env.dataverseapplicationid }}
        tenant-id: ${{ env.dataversetenantid }}
        allow-no-subscriptions: true
    - shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & ${{ github.workspace }}/artifacts/alm/pipelines/scripts/installdependencies.ps1  
        if ("${{ inputs.authtype }}" -eq "ClientSecret") {
            $env:AZURE_TENANT_ID = "${{ env.dataversetenantid }}"
            $env:AZURE_CLIENT_ID = "${{ env.dataverseapplicationid }}"
            $env:AZURE_CLIENT_SECRET = "${{ env.dataverseclientsecret }}"
        }
        & ${{ github.workspace }}/artifacts/alm/pipelines/scripts/connect.ps1 -Url "${{ env.dataverseurl }}"
        & ${{ github.workspace }}/artifacts/alm/pipelines/scripts/deploy.ps1 `
          -ArtifactsPath "${{ github.workspace }}/artifacts" `
      working-directory: ${{ github.workspace }}/artifacts
