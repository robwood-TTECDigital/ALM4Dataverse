name: EXPORT
description: EXPORT
inputs:
  commitcomment:
    required: true
    description: Commit comment
  dataverseurl:
    required: true
    description: Dataverse URL
  environment:
    required: false
    description: Environment name
    default: DEV_${{ github.ref_name }}
  varsjson:
    required: true
    description: Vars
  secretsjson:
    required: true
    description: Secrets    
runs:
  using: composite
  steps:
    - name: Set environment specific vars
      shell: pwsh
      run: |
        $varsjson = @"
        ${{ inputs.varsjson }}
        "@

        $vars = $varsjson | convertfrom-json

        @($vars.psobject.properties) | Where-Object { $_.Name } | foreach-object {
          $name = $_.Name 
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }

        @($vars.psobject.properties) | Where-Object { $_.Name -and $_.Name.StartsWith("${{ inputs.environment }}_", "OrdinalIgnoreCase")} | foreach-object {
          $name = $_.Name -replace "${{ inputs.environment }}_", ""
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }

        $secretsjson = @"
        ${{ inputs.secretsjson }}
        "@

        $secrets = $secretsjson | convertfrom-json
        @($secrets.psobject.properties) | Where-Object { $_.Name } | foreach-object {
          $name = $_.Name
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }

        @($secrets.psobject.properties) | Where-Object { $_.Name -and $_.Name.StartsWith("${{ inputs.environment }}_", "OrdinalIgnoreCase")} | foreach-object {
          $name = $_.Name -replace "${{ inputs.environment }}_", ""
          $value = $_.Value
          "$name=$value" | tee-object -append $env:GITHUB_ENV
        }
    - uses: microsoft/powerplatform-actions/actions-install@v1
      name: Power Platform Tool Installer
      with:
        add-tools-to-path: true
    - shell: pwsh
      run: git config --system core.longpaths true      
    - uses: actions/checkout@v4
      name: Checkout current repo
      with:
        path: self
    - shell: pwsh
      run: |
        $env:PATH="$(split-path $env:POWERPLATFORMTOOLS_PACPATH);${env:PATH}"


        $env:Build_RequestedForEmail = "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        $env:Build_RequestedFor  = "${{ github.actor }}"
        $env:Build_SourceBranchName = "${{ github.ref_name }}"

        $ErrorActionPreference = 'Stop'
        & ${{ github.action_path }}/../../scripts/installdependencies.ps1  
        & ${{ github.action_path }}/../../scripts/connect.ps1 -ConnectionString "AuthType=ClientSecret;Url=${{ env.dataverseurl }};ClientId=${{ env.dataverseapplicationid }};ClientSecret=${{ env.dataverseclientsecret }};TenantId=${{ env.dataversetenantid }};RedirectUri=http://localhost;"      

        new-item -type directory artifacts
        new-item -type directory temp

        & ${{ github.action_path }}/../../scripts/export.ps1 `
            -SourceDirectory ${{ github.workspace}}/self `
            -ArtifactStagingDirectory ${{ github.workspace}}/artifacts `
            -EnvironmentName ${{ inputs.environment }} `
            -TempDirectory ${{ github.workspace}}/temp
      working-directory: ${{ github.workspace}}/self
      
    - name: Commit and push changes
      id: commit-and-push
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        
        git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        if ($LASTEXITCODE -ne 0) { throw "git config user.email failed with exit code $LASTEXITCODE" }
        
        git config user.name "${{ github.actor }}"
        if ($LASTEXITCODE -ne 0) { throw "git config user.name failed with exit code $LASTEXITCODE" }
        
        git add .
        if ($LASTEXITCODE -ne 0) { throw "git add failed with exit code $LASTEXITCODE" }
        
        git commit -m "${{ inputs.commitcomment }}"
        if ($LASTEXITCODE -eq 0) {
            # Committed successfully
            "changes-pushed=true" | tee-object -append $env:GITHUB_OUTPUT
        } elseif ($LASTEXITCODE -eq 1) {
            Write-Host "No changes to commit"
            "changes-pushed=false" | tee-object -append $env:GITHUB_OUTPUT
        } else {
            throw "git commit failed with exit code $LASTEXITCODE"
        }
        
        git push
        if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
      working-directory: ${{ github.workspace}}/self
      
    - name: Trigger BUILD workflow
      if: steps.commit-and-push.outputs.changes-pushed == 'true'
      shell: pwsh
      run: |
        gh workflow run BUILD.yml --ref ${{ github.ref_name }}
      working-directory: ${{ github.workspace}}/self
      env:
        GH_TOKEN: ${{ github.token }}
