name: BUILD
description: BUILD
inputs:
  build-number:
    description: Build number
    required: true
runs:
  using: composite
  steps:
    - uses: microsoft/powerplatform-actions/actions-install@v1
      name: Power Platform Tool Installer
      with:
        add-tools-to-path: true
    - shell: pwsh
      run: git config --system core.longpaths true
    - uses: actions/checkout@v4
      name: Checkout current repo
      with:
        path: self
    - shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & ${{ github.action_path }}/../../scripts/installdependencies.ps1  

        new-item -type directory artifacts

        & ${{ github.action_path }}/../../scripts/build.ps1 `
          -SourceDirectory ${{ github.workspace}}/self `
          -ArtifactStagingDirectory ${{ github.workspace}}/artifacts
      working-directory: ${{ github.workspace}}/self
    - uses: actions/upload-artifact@v4
      with:
        path: ${{ github.workspace}}/artifacts/
        name: artifacts
    - shell: pwsh
      name: Create and push tag
      run: |
        $ErrorActionPreference = 'Stop'
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        $rawBuildNumber = "${{ inputs.build-number }}"
        $sanitizedBuildNumber = $rawBuildNumber `
          -replace '[^a-zA-Z0-9._/-]', '-' `
          -replace '\.{2,}', '-' `
          -replace '/{2,}', '/'
        $sanitizedBuildNumber = $sanitizedBuildNumber.Trim('/', '.')
        if ($sanitizedBuildNumber.EndsWith('.lock')) {
          $sanitizedBuildNumber = $sanitizedBuildNumber -replace '\.lock$', '-lock'
        }
        if ([string]::IsNullOrWhiteSpace($sanitizedBuildNumber)) {
          throw "Build number '$rawBuildNumber' cannot be converted to a valid git tag value"
        }
        $tagName = $sanitizedBuildNumber
        git tag "$tagName"
        git push origin "$tagName"
      working-directory: ${{ github.workspace}}/self
      
    - name: Trigger DEPLOY workflow
      if: github.event_name != 'workflow_dispatch' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'EXPORT')
      shell: pwsh
      run: |
        gh workflow run DEPLOY.yml --ref ${{ github.ref_name }} -f artifacts-run-id=${{ github.run_id }}
      working-directory: ${{ github.workspace}}/self
      env:
        GH_TOKEN: ${{ github.token }}
